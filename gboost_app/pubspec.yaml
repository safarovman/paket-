name: gboost_app
description: "GBoost - O'zbekistonning birinchi xavfsiz geyming ekotizimi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Animations
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # Payments (O'zbek)
  # click_flutter: ^1.0.0   # hali chiqmagan, keyinroq qo'shiladi
  # payme_flutter: ^1.0.0   # hali chiqmagan, keyinroq qo'shiladi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Calibri
  #     fonts:
  #       - asset: assets/fonts/Calibri.ttf
  #       - asset: assets/fonts/Calibri-Bold.ttf
  #         weight: 700
